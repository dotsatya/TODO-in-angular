<div class="min-h-screen bg-slate-100 px-4 py-10">

  <div class="mx-auto max-w-2xl">

    <!-- Header -->
    <div class="mb-8 text-center">
      <h1 class="text-4xl font-bold text-slate-800">
        Todo List
      </h1>

      <p class="mt-2 text-slate-500">
        Add, update and manage your tasks
      </p>
    </div>


    <!-- Add Todo -->
    <div class="mb-6 flex gap-3 rounded-xl bg-white p-4 shadow-sm">

      <input
        type="text"
        [(ngModel)]="txt"
        placeholder="Add your task..."
        class="flex-1 rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
      />

      <button
        (click)="addItem()"
        class="rounded-lg bg-blue-600 px-6 py-3 font-semibold text-white hover:bg-blue-700"
      >
        Add
      </button>

    </div>


    <!-- Todo List -->
    <div class="space-y-3">

      @for (item of todos(); track item.id) {

        <div
          class="flex items-center justify-between rounded-xl bg-white p-4 shadow-sm"
        >

          <div>
            <!-- <p class="text-xs font-medium text-slate-400">
              Task #{{ item.id }}
            </p> -->

            <p class="mt-1 text-lg font-medium text-slate-800">
              {{ item.text }}
            </p>
          </div>


          <div class="flex gap-2">

            <button
              (click)="taskUpdate(item.id)"
              class="rounded-lg bg-blue-50 px-4 py-2 text-sm font-medium text-blue-600 hover:bg-blue-100"
            >
              Update
            </button>

            <button
              (click)="taskDelete(item.id)"
              class="rounded-lg bg-red-50 px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-100"
            >
              Delete
            </button>

          </div>

        </div>

      }

    </div>

  </div>


  <!-- UPDATE POPUP -->
  @if (showUpdatePopup) {

    <!-- Background overlay -->
    <div
      class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm"
      (click)="closePopup()"
    ></div>


    <!-- Popup -->
    <div
      class="fixed left-1/2 top-1/2 z-50 w-[90%] max-w-md -translate-x-1/2 -translate-y-1/2 rounded-2xl bg-white p-6 shadow-2xl"
      (click)="$event.stopPropagation()"
    >

      <h2 class="text-2xl font-bold text-slate-800">
        Update Task
      </h2>

      <p class="mt-1 text-sm text-slate-500">
        Change your task below.
      </p>


      <!-- Input -->
      <input
        type="text"
        [(ngModel)]="updateText"
        class="mt-5 w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
      />


      <!-- Buttons -->
      <div class="mt-5 flex justify-end gap-3">

        <button
          (click)="closePopup()"
          class="rounded-lg border border-slate-300 px-5 py-2.5 font-medium text-slate-600 hover:bg-slate-100"
        >
          Cancel
        </button>

        <button
          (click)="saveUpdate()"
          class="rounded-lg bg-blue-600 px-5 py-2.5 font-medium text-white hover:bg-blue-700"
        >
          Save
        </button>

      </div>

    </div>

  }

</div>
